<style>
:root{--bg:#f3f3f2;--ink:#151515;--muted:#666;--line:#d6d6d3;--surface:#fff;--band:#111;--bad:#a12a1f}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Source Sans 3",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--band);color:#fff;padding:18px 16px}
.wrap{max-width:880px;margin:0 auto;width:100%}
header .wrap{display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}.brand img{height:40px;filter:invert(1)}
.brand b{font:700 18px Archivo,sans-serif;display:block}.brand span{font-size:13px;opacity:.75}
main{flex:1;padding:32px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:400px;margin:0 auto}
h1{font:700 22px Archivo,sans-serif;margin:0 0 6px}p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
button,.btn{font:600 15px "Source Sans 3",sans-serif;background:var(--band);color:#fff;border:0;border-radius:4px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:7px 12px;font-size:14px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1em}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.mod{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--band);border-radius:6px;padding:20px;text-decoration:none;color:inherit;display:block}
.mod:hover{border-color:#999}.mod b{font:700 19px Archivo,sans-serif;display:block;margin-bottom:4px}.mod span{color:var(--muted);font-size:15px}
[hidden]{display:none!important}
footer{text-align:center;font-size:12px;color:var(--muted);padding:16px}
</style>
</head>

<main><div class="wrap">
  <form class="card" id="login" hidden novalidate>
    <h1>Entrar</h1><p>Usa tu correo y contraseña de CASYCO.</p>
    <label for="em">Correo</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button type="submit" id="lbtn" style="width:100%;margin-top:8px">Entrar</button>
    <p style="margin:14px 0 0;font-size:13px"><a href="#" id="olvide">Olvidé mi contraseña</a></p>
  </form>
  <section id="menu" hidden>
    <h1 id="hola">Hola</h1><p>Elige a qué quieres entrar.</p>
    <div class="mods" id="mods"></div>
    <div class="err" id="merr"></div>
  </section>
</div></main>
<footer>DIC · CASYCO</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(async function(){
const C=window.CASYCO_CFG;const sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);const qs=new URLSearchParams(location.search);
async function menu(sess){
  const {data:u,error}=await sb.from("app_usuarios").select("nombre,email,modulos").eq("user_id",sess.user.id).maybeSingle();
  $("#login").hidden=true;$("#usr").hidden=false;$("#usr-n").textContent=(u&&u.nombre)||sess.user.email;
  const mods=((u&&u.modulos)||[]).filter(m=>C.modulos[m]);
  if(error||!mods.length){$("#menu").hidden=false;$("#hola").textContent="Sin acceso";$("#merr").textContent="Tu usuario todavía no tiene módulos asignados. Pide a Manuel que te dé acceso.";return;}
  const pide=qs.get("m");
  if(qs.get("sin"))$("#merr").textContent="No tienes acceso a "+(C.modulos[qs.get("sin")]||{nombre:qs.get("sin")}).nombre+".";
  else if(pide&&mods.includes(pide)){location.replace(C.modulos[pide].url);return;}
  else if(mods.length===1){location.replace(C.modulos[mods[0]].url);return;}
  $("#menu").hidden=false;$("#hola").textContent="Hola, "+(((u&&u.nombre)||"").split(" ")[0]||"bienvenido");
  const box=$("#mods");box.innerHTML="";mods.forEach(m=>{const a=document.createElement("a");a.className="mod";a.href=C.modulos[m].url;a.innerHTML="<b></b><span></span>";a.querySelector("b").textContent=C.modulos[m].nombre;a.querySelector("span").textContent=C.modulos[m].desc;box.append(a);});}
$("#login").addEventListener("submit",async e=>{e.preventDefault();$("#lerr").textContent="";$("#lbtn").disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});$("#lbtn").disabled=false;
  if(error){$("#lerr").textContent="Correo o contraseña incorrectos.";return;}menu(data.session);});
$("#olvide").onclick=async e=>{e.preventDefault();const em=$("#em").value.trim();if(!em){$("#lerr").textContent="Escribe tu correo y vuelve a dar clic.";return;}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});$("#lerr").textContent=error?"No se pudo enviar el correo.":"Te enviamos un correo para cambiar tu contraseña.";};
$("#salir").onclick=async()=>{await sb.auth.signOut();location.replace(location.pathname);};
const {data}=await sb.auth.getSession();if(data.session)menu(data.session);else $("#login").hidden=false;
})();
</script>
</body>
</html>
