<script>

const FONTS_LINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">';
const html = htm.bind(preact.h);
let __inst = null, __pending = false;
function __render() { __pending = false; preact.render(TPL(__inst.renderVals()), document.getElementById('app')); }
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(u) { const v = typeof u === 'function' ? u(this.state) : u; this.state = Object.assign({}, this.state, v || {}); if (!__pending && __inst) { __pending = true; queueMicrotask(__render); } }
  forceUpdate() { this.setState({}); }
}


class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.AUTORIZA = { HOTELERIA: 'Manuel Castillo', INDUSTRIAL: 'Jesús Castillo' };
    this.PAGA = { 'SANTANDER': 'Manuel Castillo', 'CUENTA PERSONAL': 'Manuel Castillo', 'EFECTIVO': 'Manuel Castillo', 'BANORTE': 'Dulce Castillo', 'SIN REGISTRO': 'Sin registro' };
    this.META = {
      PENDIENTE: { label: 'Sin revisar', bg: '#E6E4DD', fg: '#2B2E34' },
      REVISION: { label: 'Revisión c/ obra', bg: '#FDF0D5', fg: '#7A4A00' },
      SIN_PAGO_CLIENTE: { label: 'Sin pago del cliente', bg: '#EDE4F7', fg: '#4C1D95' },
      POR_PAGAR: { label: 'Autorizado · por pagar', bg: '#DBE7FB', fg: '#1E3A8A' },
      PAGADO: { label: 'Pagado', bg: '#DCEFE4', fg: '#14532D' },
      CANCELADO: { label: 'Cancelado', bg: '#F1F1EF', fg: '#5B5F68' }
    };
    const obraDiv = {
      'GP42': 'HOTELERIA', 'TXOCO': 'HOTELERIA', 'REFORMA': 'HOTELERIA', 'HGR-HAMBURGO': 'HOTELERIA', 'SMA': 'HOTELERIA',
      'HOLBOX OC': 'HOTELERIA', 'HOLBOX HHB': 'HOTELERIA', 'CASA MANOLO': 'HOTELERIA', 'LOCALES COMERCIALES': 'HOTELERIA',
      'TACUBA 53': 'HOTELERIA', 'ACABADOS TACUBA': 'HOTELERIA', 'JURICA': 'HOTELERIA', 'HGPSJ': 'HOTELERIA', 'OXXO': 'HOTELERIA',
      'OTRAS': 'HOTELERIA', 'SMA/HGR/GP42': 'HOTELERIA', 'GASTOS GENERALES CASYCO': 'HOTELERIA',
      'AISLACON': 'INDUSTRIAL', 'SALTO': 'INDUSTRIAL', 'CUAUTLAN': 'INDUSTRIAL'
    };
    const rows = [];
    const uniq = (arr) => Array.from(new Set(arr.filter(Boolean))).sort();
    this.state = {
      tab: 'captura',
      rows,
      obraDiv,
      proveedores: uniq(rows.map(r => r.proveedor)),
      solicitantes: uniq(rows.map(r => r.solicita)),
      form: { oc: '', monto: '', proveedor: '', obra: '', division: 'HOTELERIA', solicita: '', notas: '' },
      formMsg: '', formOk: true,
      reviewer: 'LMCM',
      buscar: '', filtroVista: 'autorizar', flash: '', flashPagar: false, undo: null,
      rol: '', userEmail: '', proveedoresCat: [], solicitantesCat: [], rolesList: [],
      catProv: { id: '', nombreComercial: '', beneficiario: '', rfc: '', banco: '', clabe: '' }, provFiltro: 'TODOS', provBuscar: '', editId: '', catObra: { nombre: '', division: 'HOTELERIA' }, catSol: { nombre: '', puesto: '' },
      rolForm: { email: '', nombre: '', rol: 'compras' }, catMsg: '', catOk: true,
      payBank: {},
      finFilter: 'TODOS',
      weekOffset: 0,
      budgets: {},
      deposits: [],
      depForm: { obra: '', q: '', fecha: '', monto: '', mo: '', he: '', ot: '', nota: '' },
      depMsg: '', depOk: true, depQ: '',
      persHist: [], loaded: false, dbOk: true, dbMsg: ''
    };
  }

  pad(n) { return String(n).padStart(2, '0'); }
  iso(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); }
  hoy() { return this.iso(new Date()); }
  toD(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  dias(a, b) { return Math.round((this.toD(b) - this.toD(a)) / 86400000); }
  fd(s) { if (!s) return '—'; const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  money(n) { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n || 0); }
  num(v) { const n = parseFloat(String(v || '').replace(/[^0-9.]/g, '')); return isNaN(n) ? 0 : n; }
  bucket(r) {
    if (r.estatus === 'CANCELADO') return 'CANCELADO';
    if (r.fechaPago) return 'PAGADO';
    if (r.estatus === 'AUTORIZADO') return 'POR_PAGAR';
    return r.estatus;
  }
  chip(m) { return 'display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;background:' + m.bg + ';color:' + m.fg; }
  upd(id, patch) { this.setState(s => ({ rows: s.rows.map(r => r.id === id ? Object.assign({}, r, patch) : r) })); if (this.db) this.db.doc('ocs/' + id).update(patch).catch(e => this.dbErr(e)); }
  dbErr(e) { this.setState({ dbMsg: 'No se pudo guardar el último cambio (' + ((e && e.code) || 'error') + '). Revisa tu conexión y vuelve a intentarlo.' }); }
  saveObras(map) { if (this.db) this.db.doc('config/obras').set({ map }).catch(e => this.dbErr(e)); }
  setForm(k, v) {
    this.setState(s => {
      const form = Object.assign({}, s.form, { [k]: v });
      if (k === 'obra') { const d = s.obraDiv[v.trim().toUpperCase()]; if (d) form.division = d; }
      return { form, formMsg: '' };
    });
  }

  qKeyOf(iso) { return iso.slice(0, 7) + '|' + (Number(iso.slice(8, 10)) <= 15 ? 'q1' : 'q2'); }
  qLabelOf(key) {
    const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const p = key.split('|'), ym = p[0].split('-').map(Number);
    return (p[1] === 'q1' ? '1ª' : '2ª') + ' quincena ' + MES[ym[1] - 1] + ' ' + ym[0];
  }
  depSum(obra, qk) {
    const l = this.state.deposits.filter(d => d.obra === obra && d.q === qk);
    const t = (k) => l.reduce((a, d) => a + d[k], 0);
    const monto = t('monto'), mo = t('mo'), he = t('he'), ot = t('ot');
    return { n: l.length, monto, mo, he, ot, disp: monto - mo - he - ot };
  }
  setDep(k, v) {
    this.setState(s => {
      const depForm = Object.assign({}, s.depForm, { [k]: v });
      if (k === 'fecha' && /^\d{4}-\d{2}-\d{2}$/.test(v)) depForm.q = this.qKeyOf(v);
      return { depForm, depMsg: '' };
    });
  }
  submitDep() {
    const s = this.state, f = s.depForm, hoy = this.hoy();
    const obra = f.obra.trim().toUpperCase();
    const monto = this.num(f.monto), mo = this.num(f.mo), he = this.num(f.he), ot = this.num(f.ot);
    const fecha = f.fecha || hoy, q = f.q || this.qKeyOf(fecha);
    const falta = [];
    if (!obra) falta.push('obra'); if (!monto) falta.push('monto depositado');
    if (falta.length) { this.setState({ depMsg: 'Falta: ' + falta.join(', ') + '.', depOk: false }); return; }
    if (mo + he + ot > monto) { this.setState({ depMsg: 'Lo asignado a mano de obra y utilidad supera el depósito.', depOk: false }); return; }
    const dep = { id: 'd' + Date.now(), obra, q, fecha, monto, mo, he, ot, nota: f.nota.trim() };
    if (this.db) { const body = Object.assign({}, dep); delete body.id; this.db.doc('depositos/' + dep.id).set(body).catch(e => this.dbErr(e)); }
    if (!s.obraDiv[obra]) this.saveObras(Object.assign({}, s.obraDiv, { [obra]: 'HOTELERIA' }));
    this.setState({
      deposits: s.deposits.concat([dep]),
      obraDiv: s.obraDiv[obra] ? s.obraDiv : Object.assign({}, s.obraDiv, { [obra]: 'HOTELERIA' }),
      depForm: { obra: '', q: f.q, fecha: f.fecha, monto: '', mo: '', he: '', ot: '', nota: '' },
      depQ: q,
      depMsg: 'Depósito de ' + obra + ' registrado: ' + this.money(monto - mo - he - ot) + ' disponibles para materiales.', depOk: true
    });
  }

  slug(t) { return (String(t || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120)) || 'X'; }
  clabeOk(c) {
    if (!/^\d{18}$/.test(c)) return false;
    const w = [3, 7, 1]; let t = 0;
    for (let i = 0; i < 17; i++) t += (Number(c[i]) * w[i % 3]) % 10;
    return (10 - (t % 10)) % 10 === Number(c[17]);
  }
  bancoDeClabe(c) {
    const B = { '002': 'BANAMEX', '006': 'BANCOMEXT', '009': 'BANOBRAS', '012': 'BBVA MÉXICO', '014': 'SANTANDER', '019': 'BANJERCITO', '021': 'HSBC', '030': 'BAJÍO', '036': 'INBURSA', '042': 'MIFEL', '044': 'SCOTIABANK', '058': 'BANREGIO', '059': 'INVEX', '060': 'BANSI', '062': 'AFIRME', '072': 'BANORTE', '106': 'BANK OF AMERICA', '112': 'BMONEX', '127': 'BANCO AZTECA', '130': 'COMPARTAMOS', '132': 'MULTIVA', '133': 'ACTINVER', '136': 'INTERCAM', '137': 'BANCOPPEL', '138': 'UALÁ', '140': 'CONSUBANCO', '143': 'CIBANCO', '145': 'BBASE', '147': 'BANKAOOL', '148': 'PAGATODO', '150': 'INMOBILIARIO', '151': 'DONDE', '152': 'BANCREA', '155': 'ICBC', '156': 'SABADELL', '166': 'BANCO DEL BIENESTAR', '167': 'HEY BANCO', '638': 'NU MÉXICO', '646': 'STP', '722': 'MERCADO PAGO W', '728': 'SPIN BY OXXO' };
    return B[String(c || '').slice(0, 3)] || '';
  }
  setCat(grupo, k, v) {
    this.setState(s => {
      const o = Object.assign({}, s[grupo], { [k]: v });
      if (grupo === 'catProv' && k === 'clabe') { const d = v.replace(/\D/g, '').slice(0, 18); o.clabe = d; const b = this.bancoDeClabe(d); if (b && (!s.catProv.banco || s.catProv.banco === this.bancoDeClabe(s.catProv.clabe))) o.banco = b; }
      return { [grupo]: o, catMsg: '' };
    });
  }
  catAviso(msg, ok) { this.setState({ catMsg: msg, catOk: !!ok }); }
  rfcOk(r) { return /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(r); }
  provFaltan(p) {
    const f = [];
    if (!p.beneficiario) f.push('razón social');
    if (!p.rfc) f.push('RFC'); else if (!this.rfcOk(p.rfc)) f.push('RFC inválido');
    if (!p.clabe) f.push('CLABE'); else if (!this.clabeOk(p.clabe)) f.push(/^\d{16}$/.test(p.clabe) ? 'CLABE (es tarjeta)' : 'CLABE inválida');
    if (!p.banco) f.push('banco');
    return f;
  }
  provBuscarNombre(n) { return n ? (this._provMap || {})[String(n).trim().toUpperCase()] : null; }
  guardarProv() {
    const s = this.state, p = s.catProv;
    const nombreComercial = p.nombreComercial.trim().toUpperCase(), beneficiario = p.beneficiario.trim().toUpperCase(), rfc = (p.rfc || '').trim().toUpperCase().replace(/\s/g, ''), banco = p.banco.trim().toUpperCase(), clabe = p.clabe.trim();
    if (!nombreComercial) return this.catAviso('Escribe al menos el nombre comercial del proveedor.');
    const id = p.id || this.slug(nombreComercial);
    if (!p.id && s.proveedoresCat.some(x => x.id === id)) return this.catAviso('Ya existe un proveedor con ese nombre comercial. Usa «Editar» para cambiar sus datos.');
    const prev = s.proveedoresCat.find(x => x.id === id) || {};
    const data = Object.assign({}, prev, { nombreComercial, beneficiario, rfc, banco, clabe, actualizo: s.userEmail || '' }); delete data.id;
    this.setState({ proveedoresCat: s.proveedoresCat.filter(x => x.id !== id).concat([Object.assign({ id }, data)]), catProv: { id: '', nombreComercial: '', beneficiario: '', rfc: '', banco: '', clabe: '' } });
    if (this.db) this.db.doc('proveedores/' + id).set(data).catch(e => this.dbErr(e));
    const faltan = this.provFaltan(data);
    this.catAviso('Proveedor ' + nombreComercial + ' guardado' + (faltan.length ? ' como INCOMPLETO (falta: ' + faltan.join(', ') + ').' : ' con datos completos.'), true);
  }
  guardarObra() {
    const s = this.state, nombre = s.catObra.nombre.trim().toUpperCase();
    if (!nombre) return this.catAviso('Escribe el nombre de la obra.');
    if (s.obraDiv[nombre]) return this.catAviso('La obra ' + nombre + ' ya existe.');
    const map = Object.assign({}, s.obraDiv, { [nombre]: s.catObra.division });
    this.setState({ obraDiv: map, catObra: { nombre: '', division: 'HOTELERIA' } });
    this.saveObras(map);
    this.catAviso('Obra ' + nombre + ' agregada a ' + (s.catObra.division === 'INDUSTRIAL' ? 'Industrial' : 'Hotelería') + '.', true);
  }
  guardarSol() {
    const s = this.state, nombre = s.catSol.nombre.trim().toUpperCase(), puesto = s.catSol.puesto.trim().toUpperCase();
    if (!nombre) return this.catAviso('Escribe el nombre de quien solicita.');
    const id = this.slug(nombre);
    if (s.solicitantesCat.some(x => x.id === id)) return this.catAviso(nombre + ' ya está registrado.');
    this.setState({ solicitantesCat: s.solicitantesCat.concat([{ id, nombre, puesto }]), catSol: { nombre: '', puesto: '' } });
    if (this.db) this.db.doc('solicitantes/' + id).set({ nombre, puesto }).catch(e => this.dbErr(e));
    this.catAviso(nombre + ' agregado.', true);
  }
  async guardarRol() {
    const f = this.state.rolForm, email = f.email.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return this.catAviso('Escribe un correo válido.');
    if (!window.__rolesApi) return;
    const r = await window.__rolesApi.guardar({ email, nombre: f.nombre.trim(), rol: f.rol });
    if (r.error) return this.catAviso('No se pudo guardar el permiso: ' + r.error.message);
    this.setState({ rolForm: { email: '', nombre: '', rol: 'compras' } });
    this.catAviso('Permiso guardado para ' + email + '.', true);
    window.__rolesApi.cargar();
  }

  async descargarReporte(titulo) {
    let dl = null; try { dl = await window.claude.use('downloads'); } catch (e) {}
    if (!dl) { this.setState({ dbMsg: 'Esta vista no permite descargar archivos.' }); return; }
    const el = document.querySelector('.rep'); if (!el) return;
    const css = Array.from(document.querySelectorAll('style')).map(x => x.textContent).join('\n');
    const doc = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>' + titulo + '</title>' + FONTS_LINK + '<style>' + css + '</style></head><body style="background:#FFFFFF;margin:0;padding:24px">' + el.outerHTML + '</body></html>';
    try { await dl.save({ filename: 'Reporte CASYCO - ' + titulo + ' - ' + this.hoy() + '.html', data: doc }); }
    catch (e) { if (!e || e.code !== 'declined') this.setState({ dbMsg: 'No se pudo descargar el reporte (' + ((e && e.code) || 'error') + ').' }); }
  }

  decorate(r, hoy, dA, dC) {
    const b = this.bucket(r), M = this.META[b], id = r.id;
    let d = null, alarmTxt = '';
    const pl = (n) => n + (n === 1 ? ' día' : ' días');
    if (b === 'PENDIENTE') { d = Math.max(0, this.dias(r.fechaCaptura, hoy)); alarmTxt = d === 0 ? 'Enviada hoy' : pl(d) + ' sin revisar'; }
    else if (b === 'REVISION' || b === 'SIN_PAGO_CLIENTE') { d = Math.max(0, this.dias(r.fechaCaptura, hoy)); alarmTxt = pl(d) + ' sin autorizar'; }
    else if (b === 'POR_PAGAR') { d = Math.max(0, this.dias(r.fechaAut || r.fechaCaptura, hoy)); alarmTxt = d === 0 ? 'Autorizada hoy' : pl(d) + ' sin pagar'; }
    const lvl = d === null ? null : (d >= dC ? 'crit' : d >= dA ? 'warn' : 'ok');
    const AL = { ok: ['#DCEFE4', '#14532D'], warn: ['#FDF0D5', '#7A4A00'], crit: ['#FBE0DC', '#9F1D12'] };
    const alarmStyle = lvl ? 'display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap;background:' + AL[lvl][0] + ';color:' + AL[lvl][1] : '';
    const bancoSel = this.state.payBank[id] || 'SANTANDER';
    const hoyS = hoy;
    const prev = { estatus: r.estatus, fechaAut: r.fechaAut, fechaPago: r.fechaPago, banco: r.banco };

  submit() {
    if (this.state.editId) return this.guardarEdicion();
    const s = this.state, f = s.form;
    const oc = f.oc.trim().toUpperCase(), prov = f.proveedor.trim().toUpperCase(), sol = f.solicita.trim().toUpperCase();
    const obra = f.obra.trim().toUpperCase() || 'GASTOS GENERALES CASYCO';
    const monto = this.num(f.monto);
    const falta = [];
    if (!oc) falta.push('OC'); if (!monto) falta.push('monto'); if (!prov) falta.push('proveedor'); if (!sol) falta.push('quién solicita');
    if (falta.length) { this.setState({ formMsg: 'Falta: ' + falta.join(', ') + '.', formOk: false }); return; }
    if (s.rows.some(r => r.oc === oc && r.estatus !== 'CANCELADO')) { this.setState({ formMsg: 'La OC ' + oc + ' ya está en el filtro.', formOk: false }); return; }
    const provCat = this.provBuscarNombre(prov);
    if (!provCat) { this.setState({ formMsg: 'El proveedor ' + prov + ' no está registrado. Regístralo en Catálogos (nombre comercial, razón social, RFC, CLABE y banco).', formOk: false }); return; }
    if (!s.obraDiv[obra]) { this.setState({ formMsg: 'La obra ' + obra + ' no está registrada. Agrégala en Catálogos.', formOk: false }); return; }
    if (!s.solicitantesCat.some(p => p.nombre === sol)) { this.setState({ formMsg: sol + ' no está registrado en «Quién solicita». Agrégalo en Catálogos.', formOk: false }); return; }
    let id = oc.replace(/[^A-Za-z0-9_\-.~:@+]/g, '_'); if (!id || id === '.' || id === '..') id = 'oc'; if (s.rows.some(r => r.id === id)) id = id + '_' + Date.now();
    const row = { id, oc, monto, proveedor: provCat.nombreComercial, obra, solicita: sol, notas: f.notas.trim(), estatus: 'PENDIENTE', division: f.division, fechaCaptura: this.hoy(), fechaAut: '', banco: '', fechaPago: '', notaDir: '', capturo: s.userEmail || '' };
    if (this.db) { const body = Object.assign({}, row); delete body.id; this.db.doc('ocs/' + id).set(body).catch(e => this.dbErr(e)); }
    if (s.obraDiv[obra] !== f.division) this.saveObras(Object.assign({}, s.obraDiv, { [obra]: f.division }));
    const add = (arr, v) => arr.indexOf(v) >= 0 ? arr : arr.concat([v]).sort();
    this.setState({
      rows: s.rows.concat([row]),
      obraDiv: Object.assign({}, s.obraDiv, { [obra]: f.division }),
      proveedores: add(s.proveedores, prov),

      formMsg: 'OC ' + oc + ' enviada · la autoriza ' + this.AUTORIZA[f.division] + '.', formOk: true
    });
  }

  guardarEdicion() {
    const s = this.state, f = s.form, id = s.editId;
    const r = s.rows.find(x => x.id === id);
    if (!r) { this.setState({ editId: '', formMsg: 'No se encontró la OC a editar.', formOk: false }); return; }
    if (r.fechaPago) { this.setState({ formMsg: 'La OC ' + r.oc + ' ya está pagada; no se puede editar.', formOk: false }); return; }
    const oc = f.oc.trim().toUpperCase(), sol = f.solicita.trim().toUpperCase();
    const obra = f.obra.trim().toUpperCase() || 'GASTOS GENERALES CASYCO';
    const monto = this.num(f.monto);
    const falta = [];
    if (!oc) falta.push('OC'); if (!monto) falta.push('monto'); if (!f.proveedor.trim()) falta.push('proveedor'); if (!sol) falta.push('quién solicita');
    if (falta.length) { this.setState({ formMsg: 'Falta: ' + falta.join(', ') + '.', formOk: false }); return; }
    if (s.rows.some(x => x.id !== id && x.oc === oc && x.estatus !== 'CANCELADO')) { this.setState({ formMsg: 'Ya existe otra OC con el número ' + oc + '.', formOk: false }); return; }
    const provCat = this.provBuscarNombre(f.proveedor);
    const mismoProv = !provCat && f.proveedor.trim().toUpperCase() === r.proveedor;
    if (!provCat && !mismoProv) { this.setState({ formMsg: 'El proveedor ' + f.proveedor.trim().toUpperCase() + ' no está registrado. Regístralo en Catálogos.', formOk: false }); return; }
    if (!s.obraDiv[obra]) { this.setState({ formMsg: 'La obra ' + obra + ' no está registrada. Agrégala en Catálogos.', formOk: false }); return; }
    if (!s.solicitantesCat.some(p => p.nombre === sol)) { this.setState({ formMsg: sol + ' no está registrado en «Quién solicita». Agrégalo en Catálogos.', formOk: false }); return; }
    const nuevo = { oc, monto, proveedor: provCat ? provCat.nombreComercial : r.proveedor, obra, division: f.division, solicita: sol, notas: f.notas.trim() };
    const etiquetas = { oc: 'OC', monto: 'Monto', proveedor: 'Proveedor', obra: 'Obra', division: 'División', solicita: 'Solicita', notas: 'Observaciones' };
    const cambios = Object.keys(nuevo).filter(k => String(r[k] == null ? '' : r[k]) !== String(nuevo[k])).map(k =>
      etiquetas[k] + ' ' + (k === 'monto' ? this.money(r.monto) + ' → ' + this.money(monto) : (r[k] || '—') + ' → ' + (nuevo[k] || '—')));
    if (!cambios.length) { this.setState({ formMsg: 'No hiciste cambios en la OC ' + r.oc + '.', formOk: false }); return; }
    const patch = Object.assign({}, nuevo, { editada: (r.editada || []).concat([{ fecha: this.hoy(), por: s.userEmail || '', cambios: cambios.join('; ') }]) });
    let extra = '';
    if (r.estatus === 'AUTORIZADO' && monto !== r.monto) { patch.estatus = 'PENDIENTE'; patch.fechaAut = ''; extra = ' Como cambió el monto, regresó a «Por autorizar».'; }
    this.upd(id, patch);
    this.setState({ editId: '', form: { oc: '', monto: '', proveedor: '', obra: '', division: 'HOTELERIA', solicita: f.solicita, notas: '' }, formMsg: 'OC ' + oc + ' actualizada: ' + cambios.join('; ') + '.' + extra, formOk: true });
  }

    }));

    // filtro

    const queue = rows.filter(r => r.division === revDiv && inQueue(r) && match(r)).sort((a, b) => (prio[a.bucket] - prio[b.bucket]) || (b.dias - a.dias));
    const reviewers = [['LMCM', 'Manuel Castillo', 'HOTELERIA', 'Hotelería'], ['JCE', 'Jesús Castillo', 'INDUSTRIAL', 'Industrial']].map(x => ({

    const kpiDef = [['PENDIENTE'], ['REVISION'], ['SIN_PAGO_CLIENTE'], ['POR_PAGAR'], ['PAGADO']];

    const vivas = rows.filter(r => r.bucket !== 'CANCELADO');

    const paid = rows.filter(r => r.bucket === 'PAGADO');
    const byBank = Object.keys(this.PAGA).map(b => ({ banco: b, paga: this.PAGA[b], totalTxt: this.money(sum(paid.filter(r => r.banco === b))) }));
    const obrasAll = Array.from(new Set(rows.map(r => r.obra)));
    const byObra = obrasAll.map(o => { const l = rows.filter(r => r.obra === o); return Object.assign({ name: o, division: l[0].division === 'INDUSTRIAL' ? 'Industrial' : 'Hotelería', _t: sum(l.filter(r => r.bucket !== 'CANCELADO')) }, agg(l)); }).sort((a, b) => b._t - a._t);
    const chipDefs = [['TODOS', 'Todos']].concat(B.map(k => [k, this.META[k].label])).concat([['CANCELADO', 'Cancelado']]);
    const finChips = chipDefs.map(c => ({

      style: 'min-height:40px;padding:0 14px;border-radius:20px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;' +

    }));
    const detail = recent.filter(r => st.finFilter === 'TODOS' || r.bucket === st.finFilter);

    // semana
    const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const t0 = this.toD(hoy);
    const mon = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() - ((t0.getDay() + 6) % 7) + st.weekOffset * 7);
    const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);

    });
    const ms = saldoFmt(mesP, mesG);

    const updHist = (hid, patch) => { this.setState(s => ({ persHist: s.persHist.map(h => h.hid === hid ? Object.assign({}, h, patch) : h) })); if (this.db) this.db.doc('personal/' + hid).update(patch).catch(e => this.dbErr(e)); };
    const histDec = st.persHist.map(h => Object.assign({}, h, {

    else if (col === 'config' && id === 'obras') obras = d.map || {};
  });
  const patch = { rows, deposits, persHist, proveedoresCat, solicitantesCat, proveedores: uniq(rows.map(r => r.proveedor)), solicitantes: uniq(rows.map(r => r.solicita)) };
  if (obras) patch.obraDiv = Object.assign({}, c.state.obraDiv, obras);
  c.setState(patch);
}
let __canal = null, __aplTimer = null;
async function __cargarDatos(c) {
  const res = await sb.from('docs').select('coleccion,id,data').limit(5000);
  if (res.error) { c.setState({ loaded: true, dbOk: false, dbMsg: 'No se pudieron leer los datos (' + res.error.message + ').' }); return; }
  Object.keys(__cache).forEach(k => delete __cache[k]);
  res.data.forEach(r => { __cache[r.coleccion + '/' + r.id] = r.data; });
  __aplicar(c); c.setState({ loaded: true, dbOk: true });
  if (__canal) sb.removeChannel(__canal);
  __canal = sb.channel('docs-cambios')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, (p) => {
      if (p.eventType === 'DELETE') { const o = p.old || {}; if (o.coleccion) delete __cache[o.coleccion + '/' + o.id]; else return __cargarDatos(c); }
      else { const n = p.new; __cache[n.coleccion + '/' + n.id] = n.data; }
      clearTimeout(__aplTimer); __aplTimer = setTimeout(() => __aplicar(c), 60);
    })
    .subscribe();
}

// ---------- inicio de sesión ----------
const loginEl = document.getElementById('login'), appEl = document.getElementById('app');
function verLogin(msg) {
  appEl.hidden = true; loginEl.hidden = false;
  const m = document.getElementById('login-msg'); m.textContent = msg || ''; m.hidden = !msg;
}
document.getElementById('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = document.getElementById('login-email').value.trim(), pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) verLogin('Correo o contraseña incorrectos. Revisa los datos o pide tu acceso a Manuel.');
});
window.__salir = async () => { await sb.auth.signOut(); };
window.__rolesApi = {
  cargar: async () => { const r = await sb.from('roles').select('email,nombre,rol').order('email'); if (!r.error && __inst) __inst.setState({ rolesList: r.data || [] }); return r; },
  guardar: (u) => sb.from('roles').upsert(u),
  quitar: (email) => sb.from('roles').delete().eq('email', email)
};

let __arrancada = false;
async function arrancar(session) {
  loginEl.hidden = true; appEl.hidden = false;
  if (!__inst) { __inst = new Component({}); }
  __inst.db = dbAdapter;
  __inst.setState({ userEmail: session.user.email || '' });
  const rr = await sb.rpc('mi_rol');
  // Si la función de permisos aún no existe en la base (antes de correr el SQL 02), se conserva el acceso completo.
  const sinFuncion = rr && rr.error && (rr.error.code === 'PGRST202' || /mi_rol/i.test(rr.error.message || ''));
  __inst.setState({ rol: sinFuncion ? 'direccion' : ((rr && !rr.error && rr.data) ? rr.data : '') });
  if (rr && rr.data === 'direccion') window.__rolesApi.cargar();
  __render();
  if (!__arrancada) { __arrancada = true; await __cargarDatos(__inst); }
}
sb.auth.onAuthStateChange((evento, session) => {
  if (session) arrancar(session);
  else { __arrancada = false; if (__canal) { sb.removeChannel(__canal); __canal = null; } verLogin(evento === 'SIGNED_OUT' ? 'Sesión cerrada.' : ''); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && __inst && __arrancada) __cargarDatos(__inst); });

</script>
